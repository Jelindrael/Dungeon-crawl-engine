# Baut das Spiel „Morgenrot“ und veröffentlicht es auf GitHub Pages.
# Voraussetzung: In den Repository-Einstellungen unter „Pages“ als Quelle „GitHub Actions“ wählen.
name: Morgenrot auf GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'morgenrot/**'
      - '.github/workflows/morgenrot-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: morgenrot-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morgenrot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: morgenrot/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: morgenrot/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
